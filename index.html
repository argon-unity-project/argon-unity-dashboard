<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in · Argon Unity Project</title>
<script>
(function(){
  try{
    var stored = localStorage.getItem('argon:theme');
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', stored || (prefersDark ? 'dark' : 'light'));
  }catch(e){}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,100..1000&display=swap" rel="stylesheet" />
<link rel="icon" type="image/png" href="assets/logo.png" />
<link rel="stylesheet" href="css/styles.css?v=12" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="login-wrap">
  <div class="login-plain" id="login-body">

    <div class="login-hero">
      <img class="lh-logo" src="assets/logo.png" alt="Argon" />
      <h1 class="lh-title">ARGON UNITY PROJECT</h1>
    </div>

    <div class="login-error" id="login-error">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M10.3 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.7 3.86a2 2 0 0 0-3.4 0z"/><path d="M12 17h.01"/></svg>
      <span id="login-error-text"></span>
    </div>

    <!-- panels are injected by js/auth-page.js -->
    <div id="auth-panel"><div class="loading-wrap" style="padding:30px;"><div class="spinner"></div></div></div>

  </div>
</div>

<div class="toast-stack" id="toast-stack"></div>

<script src="js/config.js"></script>
<script src="js/icons.js"></script>
<script src="js/util.js"></script>
<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script src="js/auth-page.js"></script>
</body>
</html>
